<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{% block pagetitle %}{% endblock %}</title>
    <!-- load static -->
    {% load static %}
    <!-- Favicon -->
    <link rel="icon" href="{% static 'favicon.ico' %}" type="image/x-icon">
    <link rel="shortcut icon" href="{% static 'favicon.ico' %}" type="image/x-icon">
    <!-- CSS -->
    <link href="{% static 'bootstrap.min.css' %}" rel="stylesheet">
    <style>
        .latium-theme {
            --primary-color: #8B0000; 
            --secondary-color: #D4AF37; 
            --light-color: #F5F5F5; 
        }

        body {
            background-color: var(--light-color);
        }

        .bg-burgundy { 
            background-color: var(--primary-color);
            color: white; 
        }

        .border-burgundy { border-color: var(--primary-color) !important; }
        .text-burgundy { color: var(--primary-color); }

        .header-logo {
            color: var(--primary-color);
        }

        .latin-heading{
            color: var(--primary-color); 
            border-bottom: 2px solid var(--secondary-color); 
        }

        .title-box {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            border-radius: 30px !important;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 1); 
        }

        .nav-link {
            color: var(--primary-color) !important;
        }

        footer {
            background-color: var(--primary-color);
            color: white;
        }

        .btn-latin-outline {
            color: var(--primary-color);
            border-color: var(--primary-color);
        }
        
        .btn-latin-outline:hover {
            background-color: var(--primary-color);
            color: white;
        }

        .table-burgundy {
            background-color: var(--primary-color);
            color: white;
        }
        
        .table-burgundy th {
            font-weight: 500;
        }
        
        .term-row:hover {
            background-color: var(--light-color);
            transition: background-color 0.2s ease;
        }
    </style>
</head>
<body class="latium-theme">
<main>
    <div class="container">
        <header class="border-bottom py-3">
            <a href="/" class="d-flex align-items-center mb-3 mb-md-0 me-md-auto text-dark text-decoration-none">
                <div class="fs-2">
                    
                    <span class="header-logo ms-2">Study Latin</span>
                </div>
            </a>
            <nav class="nav nav-pills justify-content-center mt-3">
                <a class="nav-link" href="/">Главная</a>
                <a class="nav-link" href="/terms_list">Словарь терминов</a>
                <a class="nav-link" href="/phrases_list">Крылатые выражения</a>
            </nav>
        </header>

        <div class="p-5 mb-4 title-box">
            <div class="container-fluid py-3">
                <h1 class="display-3 fw-bold">{% block page-title %}{% endblock %}</h1>
                <p class="lead fs-4">{% block page-lead %}{% endblock %}</p>
            </div>
        </div>

        {% block content %}{% endblock %}

        <footer class="py-3 mt-5 text-center">
            <div class="container">
                <span class="text-white">©MMXXV Study Latin Project</span>
                <p class="text-white">Per aspera ad astra</p>
            </div>
        </footer>
    </div>
</main>
</body>
</html>
